<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1017">
<title>Mökin sää</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://api.thingspeak.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1017;
    --panel: rgba(22, 30, 42, .82);
    --panel-strong: #182231;
    --border: rgba(148, 163, 184, .15);
    --text: #f4f7fb;
    --muted: #91a0b5;
    --blue: #59a9ff;
    --green: #55d6a3;
    --red: #ff7676;
    --shadow: 0 20px 55px rgba(0, 0, 0, .28);
  }

  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 10% 0%, rgba(45, 111, 173, .20), transparent 34rem),
      radial-gradient(circle at 90% 10%, rgba(49, 136, 113, .12), transparent 30rem),
      var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button, select { font: inherit; }
  button { color: inherit; }
  .app { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 56px; }
  header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); letter-spacing: -.045em; }
  .status-badge { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: rgba(11, 16, 23, .55); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; box-shadow: 0 0 0 4px rgba(100, 116, 139, .12); }
  .status-badge.fresh .status-dot { background: var(--green); box-shadow: 0 0 0 4px rgba(85, 214, 163, .12); }
  .status-badge.delayed .status-dot { background: #fbbf24; box-shadow: 0 0 0 4px rgba(251, 191, 36, .12); }
  .status-badge.stale .status-dot, .status-badge.error .status-dot { background: var(--red); box-shadow: 0 0 0 4px rgba(255, 118, 118, .12); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .metric-card { position: relative; min-width: 0; padding: 19px; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease, background .18s ease; }
  .metric-card:hover { transform: translateY(-2px); border-color: rgba(148, 163, 184, .30); }
  .metric-card.active { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 11%, var(--panel-strong)), var(--panel)); }
  .metric-card::after { content: ""; position: absolute; width: 110px; height: 110px; right: -55px; top: -55px; border-radius: 50%; background: var(--accent); opacity: .07; }
  .metric-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .metric-label { color: var(--muted); font-size: 13px; font-weight: 650; }
  .trend { min-height: 23px; padding: 4px 7px; border-radius: 999px; background: rgba(148, 163, 184, .09); color: var(--muted); font-size: 11px; }
  .trend.up { color: #7dd3fc; }
  .trend.down { color: #a7f3d0; }
  .metric-value { margin-top: 13px; font-size: clamp(27px, 4vw, 36px); font-weight: 720; letter-spacing: -.04em; white-space: nowrap; }
  .metric-range { margin-top: 8px; color: var(--muted); font-size: 12px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 22px 0 12px; }
  .toolbar-label { color: var(--muted); font-size: 13px; font-weight: 650; }
  .segmented { display: inline-flex; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: rgba(10, 15, 22, .75); }
  .range-button, .metric-tab { border: 0; cursor: pointer; color: var(--muted); background: transparent; }
  .range-button { min-width: 52px; padding: 8px 10px; border-radius: 9px; font-size: 13px; }
  .range-button:hover, .metric-tab:hover { color: var(--text); }
  .range-button.active { color: var(--text); background: var(--panel-strong); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }

  .chart-panel { position: relative; min-height: 430px; padding: 20px 20px 15px; border: 1px solid var(--border); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow); }
  .chart-header { display: flex; align-items: start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
  .chart-title { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .updated { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .metric-tabs { display: flex; gap: 4px; }
  .metric-tab { padding: 7px 10px; border-radius: 9px; font-size: 12px; }
  .metric-tab.active { color: var(--text); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .chart-wrap { position: relative; height: 330px; }
  canvas { width: 100% !important; height: 100% !important; }
  .chart-state { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; border-radius: 16px; background: rgba(16, 23, 33, .72); color: var(--muted); text-align: center; backdrop-filter: blur(5px); }
  .chart-state[hidden] { display: none; }
  .spinner { width: 24px; height: 24px; margin: 0 auto 10px; border: 2px solid rgba(148, 163, 184, .25); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .app { width: min(100% - 20px, 560px); padding-top: 24px; }
    header { align-items: start; flex-direction: column; gap: 12px; }
    .cards { grid-template-columns: 1fr; gap: 10px; }
    .metric-card { padding: 15px 17px; }
    .metric-value { margin-top: 7px; }
    .toolbar { align-items: stretch; flex-direction: column; gap: 8px; }
    .segmented { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
    .range-button { min-width: 0; padding-inline: 4px; }
    .chart-panel { min-height: 400px; padding: 16px 12px 10px; border-radius: 18px; }
    .chart-header { align-items: stretch; flex-direction: column; gap: 12px; padding: 0 4px; }
    .metric-tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
    .chart-wrap { height: 285px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="eyebrow">Sorvasto</p>
      <h1>Mökin sää</h1>
    </div>
    <div id="statusBadge" class="status-badge" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText">Haetaan mittauksia…</span>
    </div>
  </header>

  <section class="cards" aria-label="Uusimmat mittaukset">
    <button class="metric-card active" style="--accent: var(--blue)" data-metric="temp" type="button" aria-pressed="true">
      <span class="metric-head"><span class="metric-label">Lämpötila</span><span class="trend" id="tempTrend">–</span></span>
      <span class="metric-value" id="tempVal">–</span>
      <span class="metric-range" id="tempRange">24 h min – · max –</span>
    </button>
    <button class="metric-card" style="--accent: var(--green)" data-metric="hum" type="button" aria-pressed="false">
      <span class="metric-head"><span class="metric-label">Kosteus</span><span class="trend" id="humTrend">–</span></span>
      <span class="metric-value" id="humVal">–</span>
      <span class="metric-range" id="humRange">24 h min – · max –</span>
    </button>
    <button class="metric-card" style="--accent: var(--red)" data-metric="press" type="button" aria-pressed="false">
      <span class="metric-head"><span class="metric-label">Ilmanpaine</span><span class="trend" id="pressTrend">–</span></span>
      <span class="metric-value" id="pressVal">–</span>
      <span class="metric-range" id="pressRange">24 h min – · max –</span>
    </button>
  </section>

  <div class="toolbar">
    <span class="toolbar-label">Aikaväli</span>
    <div class="segmented" role="group" aria-label="Kuvaajan aikaväli">
      <button class="range-button" data-days="1" type="button">1 pv</button>
      <button class="range-button" data-days="3" type="button">3 pv</button>
      <button class="range-button active" data-days="7" type="button" aria-pressed="true">7 pv</button>
      <button class="range-button" data-days="30" type="button">1 kk</button>
    </div>
  </div>

  <section class="chart-panel" aria-labelledby="chartTitle">
    <div class="chart-header">
      <div>
        <h2 class="chart-title" id="chartTitle">Lämpötila</h2>
        <div class="updated" id="lastUpdated">Ei vielä mittauksia</div>
      </div>
      <div class="metric-tabs" role="tablist" aria-label="Valitse mittari">
        <button class="metric-tab active" style="--accent: var(--blue)" data-metric="temp" role="tab" aria-selected="true" type="button">Lämpö</button>
        <button class="metric-tab" style="--accent: var(--green)" data-metric="hum" role="tab" aria-selected="false" type="button">Kosteus</button>
        <button class="metric-tab" style="--accent: var(--red)" data-metric="press" role="tab" aria-selected="false" type="button">Paine</button>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-state" id="chartState"><div><div class="spinner"></div>Haetaan mittauksia…</div></div>
      <canvas id="weatherChart" role="img" aria-label="Lämpötilan kuvaaja seitsemältä päivältä"></canvas>
    </div>
  </section>
</main>

<script>
const CHANNEL_ID = '3028480';
const METRICS = {
  temp:  { field: 1, label: 'Lämpötila', shortLabel: 'Lämpö', unit: '°C',  color: '#59a9ff', decimals: 1 },
  hum:   { field: 2, label: 'Kosteus',    shortLabel: 'Kosteus', unit: '%', color: '#55d6a3', decimals: 1 },
  press: { field: 3, label: 'Ilmanpaine', shortLabel: 'Paine', unit: 'hPa', color: '#ff7676', decimals: 1 }
};

let activeMetric = 'temp';
let activeDays = 7;
let currentFeeds = [];
let summaryFeeds = [];
let chart = null;
let requestController = null;

const fiDate = new Intl.DateTimeFormat('fi-FI', { day: 'numeric', month: 'numeric' });
const fiWeekday = new Intl.DateTimeFormat('fi-FI', { weekday: 'short' });
const fiTime = new Intl.DateTimeFormat('fi-FI', { hour: '2-digit', minute: '2-digit', hour12: false });

function apiUrl(days) {
  const query = new URLSearchParams({ days, timezone: 'Europe/Helsinki' });
  if (days === 30) query.set('average', 30);
  return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?${query}`;
}

function summaryApiUrl() {
  const query = new URLSearchParams({ days: 2, timezone: 'Europe/Helsinki' });
  return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?${query}`;
}

function formatNumber(value, decimals = 1) {
  return Number.isFinite(value) ? value.toFixed(decimals).replace('.', ',') : '–';
}

function formatDateTime(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}

function pointsFor(feeds, field) {
  return feeds.flatMap(feed => {
    const value = Number(feed[`field${field}`]);
    return feed[`field${field}`] !== null && feed[`field${field}`] !== '' && Number.isFinite(value)
      ? [{ x: new Date(feed.created_at), y: value }]
      : [];
  });
}

function latestTimestamp(feeds) {
  for (let i = feeds.length - 1; i >= 0; i--) if (feeds[i].created_at) return feeds[i].created_at;
  return null;
}

function updateFreshness(iso) {
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  badge.className = 'status-badge';
  if (!iso) {
    badge.classList.add('error');
    text.textContent = 'Ei mittauksia';
    return;
  }
  const minutes = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (minutes <= 30) {
    badge.classList.add('fresh');
    text.textContent = 'Mittaukset ajan tasalla';
  } else if (minutes <= 180) {
    badge.classList.add('delayed');
    text.textContent = `Viimeisin ${Math.round(minutes)} min sitten`;
  } else {
    badge.classList.add('stale');
    text.textContent = `Viimeisin ${formatDateTime(iso)}`;
  }
}

function updateCards(feeds) {
  for (const [key, metric] of Object.entries(METRICS)) {
    const points = pointsFor(feeds, metric.field);
    const last = points.at(-1);
    document.getElementById(`${key}Val`).textContent = last ? `${formatNumber(last.y, metric.decimals)} ${metric.unit}` : '–';

    const dayStart = last ? last.x.getTime() - 24 * 60 * 60 * 1000 : 0;
    const recent = points.filter(point => point.x.getTime() >= dayStart);
    const values = recent.map(point => point.y);
    const min = values.length ? Math.min(...values) : NaN;
    const max = values.length ? Math.max(...values) : NaN;
    document.getElementById(`${key}Range`).textContent = `24 h min ${formatNumber(min, metric.decimals)} · max ${formatNumber(max, metric.decimals)} ${metric.unit}`;

    const baseline = [...points].reverse().find(point => point.x.getTime() <= dayStart);
    const trendEl = document.getElementById(`${key}Trend`);
    trendEl.className = 'trend';
    if (!last || !baseline) {
      trendEl.textContent = '24 h –';
    } else {
      const change = last.y - baseline.y;
      const arrow = Math.abs(change) < .05 ? '→' : change > 0 ? '↑' : '↓';
      trendEl.textContent = `${arrow} ${formatNumber(Math.abs(change), metric.decimals)} / 24 h`;
      if (change > .05) trendEl.classList.add('up');
      if (change < -.05) trendEl.classList.add('down');
    }
  }
}

function axisOptions(days) {
  if (days === 1) return { unit: 'hour', stepSize: 3, maxTicksLimit: 9 };
  if (days === 3) return { unit: 'hour', stepSize: 12, maxTicksLimit: 7 };
  if (days === 7) return { unit: 'day', stepSize: 1, maxTicksLimit: 8 };
  return { unit: 'day', stepSize: 5, maxTicksLimit: 7 };
}

function tickLabel(value, days) {
  const date = new Date(value);
  if (days === 1) return fiTime.format(date);
  if (days === 3) return [fiWeekday.format(date), `${fiDate.format(date)} ${fiTime.format(date)}`];
  if (days === 7) return [fiWeekday.format(date), fiDate.format(date)];
  return fiDate.format(date);
}

const hoverLine = {
  id: 'hoverLine',
  afterDraw(chartInstance) {
    const active = chartInstance.tooltip?.getActiveElements();
    if (!active?.length) return;
    const x = active[0].element.x;
    const { top, bottom } = chartInstance.chartArea;
    const ctx = chartInstance.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(203, 213, 225, .24)';
    ctx.stroke();
    ctx.restore();
  }
};

function drawChart() {
  const metric = METRICS[activeMetric];
  const data = pointsFor(currentFeeds, metric.field);
  const canvas = document.getElementById('weatherChart');
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 320);
  gradient.addColorStop(0, `${metric.color}40`);
  gradient.addColorStop(1, `${metric.color}00`);
  const axis = axisOptions(activeDays);

  document.getElementById('chartTitle').textContent = metric.label;
  canvas.setAttribute('aria-label', `${metric.label}, ${activeDays} päivän kuvaaja`);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [{
        label: metric.label,
        data,
        borderColor: metric.color,
        backgroundColor: gradient,
        borderWidth: 2.25,
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: metric.color,
        tension: .22
      }]
    },
    plugins: [hoverLine],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { unit: axis.unit, stepSize: axis.stepSize },
          grid: { display: false },
          border: { color: 'rgba(148, 163, 184, .15)' },
          ticks: {
            color: '#91a0b5',
            maxTicksLimit: axis.maxTicksLimit,
            maxRotation: 0,
            autoSkip: true,
            callback: value => tickLabel(value, activeDays)
          }
        },
        y: {
          beginAtZero: false,
          grace: '8%',
          grid: { color: 'rgba(148, 163, 184, .09)' },
          border: { display: false },
          ticks: {
            color: '#91a0b5',
            maxTicksLimit: 6,
            callback: value => `${formatNumber(Number(value), activeMetric === 'press' ? 0 : 1)} ${metric.unit}`
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          backgroundColor: 'rgba(8, 13, 20, .94)',
          titleColor: '#91a0b5',
          bodyColor: '#f4f7fb',
          padding: 12,
          callbacks: {
            title: items => items[0]?.parsed?.x ? formatDateTime(items[0].parsed.x) : '',
            label: item => `${formatNumber(item.parsed.y, metric.decimals)} ${metric.unit}`
          }
        }
      }
    }
  });
}

function setMetric(key) {
  activeMetric = key;
  document.querySelectorAll('[data-metric]').forEach(element => {
    const active = element.dataset.metric === key;
    element.classList.toggle('active', active);
    if (element.matches('.metric-card')) element.setAttribute('aria-pressed', String(active));
    if (element.matches('.metric-tab')) element.setAttribute('aria-selected', String(active));
  });
  if (currentFeeds.length) drawChart();
}

function showState(message, loading = false) {
  const state = document.getElementById('chartState');
  state.hidden = !message;
  if (message) state.innerHTML = loading ? `<div><div class="spinner"></div>${message}</div>` : `<div>${message}</div>`;
}

async function loadAllData() {
  requestController?.abort();
  requestController = new AbortController();
  showState('Haetaan mittauksia…', true);
  document.getElementById('statusBadge').className = 'status-badge';
  document.getElementById('statusText').textContent = 'Haetaan mittauksia…';
  try {
    const requestOptions = { cache: 'no-store', signal: requestController.signal };
    const [chartResponse, summaryResponse] = await Promise.all([
      fetch(apiUrl(activeDays), requestOptions),
      fetch(summaryApiUrl(), requestOptions)
    ]);
    if (!chartResponse.ok || !summaryResponse.ok) {
      throw new Error(`HTTP ${chartResponse.status}/${summaryResponse.status}`);
    }
    const [chartPayload, summaryPayload] = await Promise.all([
      chartResponse.json(),
      summaryResponse.json()
    ]);
    if (!Array.isArray(chartPayload.feeds) || !chartPayload.feeds.length ||
        !Array.isArray(summaryPayload.feeds) || !summaryPayload.feeds.length) {
      throw new Error('Mittauksia ei löytynyt');
    }
    currentFeeds = chartPayload.feeds;
    summaryFeeds = summaryPayload.feeds;
    const last = latestTimestamp(summaryFeeds);
    const averaging = activeDays === 30 ? ' · kuvaaja 30 min keskiarvo' : '';
    document.getElementById('lastUpdated').textContent = `Päivitetty ${formatDateTime(last)}${averaging}`;
    updateFreshness(last);
    updateCards(summaryFeeds);
    drawChart();
    showState('');
  } catch (error) {
    if (error.name === 'AbortError') return;
    console.error(error);
    document.getElementById('statusBadge').className = 'status-badge error';
    document.getElementById('statusText').textContent = 'Datan haku epäonnistui';
    showState('Mittauksia ei saatu ladattua. Yritä hetken kuluttua uudelleen.');
  }
}

document.querySelectorAll('.range-button').forEach(button => {
  button.addEventListener('click', () => {
    activeDays = Number(button.dataset.days);
    document.querySelectorAll('.range-button').forEach(item => {
      const active = item === button;
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', String(active));
    });
    loadAllData();
  });
});

document.querySelectorAll('[data-metric]').forEach(element => {
  element.addEventListener('click', () => setMetric(element.dataset.metric));
});

window.addEventListener('load', loadAllData);
</script>
</body>
</html>
